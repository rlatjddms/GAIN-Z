# GAIN-Z 프론트 nginx (#176)
# 정적 파일을 서빙하고, API와 소셜 로그인 경로만 백엔드 컨테이너로 넘긴다.
# 프론트와 백엔드가 한 도메인이라 CORS가 필요 없고, 쿠키·리다이렉트도 그대로 동작한다.

# 앞에 TLS를 끝내는 프록시(로드밸런서 등)가 또 있으면 그쪽이 보낸 X-Forwarded-Proto를 그대로 넘긴다
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend {
    server backend:8080;   # docker-compose의 서비스 이름
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 악보·녹음 업로드 (백엔드 max-request-size와 같게)
    client_max_body_size 100m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 백엔드로 넘길 때 공통 헤더. 백엔드는 이 헤더로 소셜 로그인 redirect-uri의 {baseUrl}을 만든다
    proxy_http_version 1.1;
    # $host 는 포트를 떼므로 $http_host 를 쓴다. 그래야 80이 아닌 포트(예: localhost:8089)에서도 {baseUrl}에 포트가 붙는다
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://backend;
    }

    # 실시간 알림(SSE)은 응답을 모아 두지 말고 바로 흘려보낸다. 서버가 30분마다 끊으므로 그보다 길게 기다린다
    location /api/v1/notifications/stream {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 소셜 로그인 시작·콜백. /oauth2/redirect 는 프론트 화면이므로 넘기지 않는다
    location /oauth2/authorization/ {
        proxy_pass http://backend;
    }
    location /login/oauth2/ {
        proxy_pass http://backend;
    }

    # 이름에 해시가 붙은 빌드 파일은 오래 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 서비스 워커와 매니페스트는 캐시하지 않아야 새 배포가 바로 반영된다
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 나머지는 SPA. 없는 경로는 index.html로
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
