<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: 아이폰이 16px보다 작은 입력칸을 누를 때 화면을 확대하지 않게 (아이폰은 두 손가락 확대는 그대로 됨) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- PWA (#143): 홈 화면에 설치·전체 화면 실행. 아이콘은 로고의 번개 Z (public/icons) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GAIN-Z" />
    <title>GAIN-Z</title>
    <!-- 기본(민트) 파비콘. 고른 테마 색으로는 stores/theme.js가 바꾼다 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 9' shape-rendering='crispEdges'%3E%3Crect width='9' height='9' rx='2' fill='%2312b886'/%3E%3Cg fill='%23fff'%3E%3Crect x='5' y='1' width='2' height='1'/%3E%3Crect x='4' y='2' width='2' height='1'/%3E%3Crect x='3' y='3' width='2' height='1'/%3E%3Crect x='2' y='4' width='5' height='1'/%3E%3Crect x='4' y='5' width='2' height='1'/%3E%3Crect x='3' y='6' width='2' height='1'/%3E%3Crect x='2' y='7' width='2' height='1'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <!-- 시작 화면 (#194): 홈 화면 앱으로 열 때만. 흰 바탕에 앱 아이콘(민트 타일 + 흰 번개 Z)으로 시작해서
         타일이 녹아 사라지며 Z가 테마 색이 되고, Z가 비켜나며 G·A·I·N·-가 차라락 → GAIN-Z.
         안드로이드가 먼저 보여 주는 화면(아이콘 + 흰 배경색, manifest)과 이어진다. 앱 스크립트보다 먼저 보이게 여기에 둔다 -->
    <script>
      (function () {
        var root = document.documentElement
        if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) root.classList.add('standalone')
        // 고른 테마 색 (stores/theme.js의 'gainz-theme', 값은 constants/themes.js와 같게)
        var colors = { mint: '#12b886', teal: '#0c8599', cherry: '#e64980', cobalt: '#2d5bff', lavender: '#7950f2', amber: '#f08c00', graphite: '#343a40' }
        var theme = null
        try { theme = localStorage.getItem('gainz-theme') } catch (e) {}
        root.style.setProperty('--splash-color', colors[theme] || colors.mint)
      })()
    </script>
    <style>
      #splash { display: none; }
      .standalone #splash {
        --cell: calc(min(248px, 62vw) / 31);
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #fff; transition: opacity 0.35s ease;
        /* 스크립트가 못 걷어 내도 화면을 막지 않게 */
        animation: splash-away 0.3s ease 5s forwards;
      }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash svg { position: relative; width: calc(var(--cell) * 31); height: auto; overflow: visible; }
      /* 앱 아이콘과 같은 타일: Z 높이가 타일의 55%, 아이콘 색은 항상 민트 */
      #splash .tile {
        position: absolute; left: 50%; top: 50%; width: calc(var(--cell) * 12.7); height: calc(var(--cell) * 12.7);
        margin: calc(var(--cell) * -6.35) 0 0 calc(var(--cell) * -6.35); border-radius: 22.5%; background: #12b886;
        animation: splash-tile 0.32s ease-in 0.15s both;
      }
      /* Z(오른쪽 끝 5칸)를 가운데에 두었다가 제자리로. 흰색에서 테마 색으로 */
      #splash .z { fill: var(--splash-color); animation: splash-zc 0.25s ease 0.15s both, splash-z 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.42s both; }
      #splash .l { fill: var(--splash-color); animation: splash-l 0.22s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #splash .l1 { animation-delay: 0.55s; }
      #splash .l2 { animation-delay: 0.62s; }
      #splash .l3 { animation-delay: 0.69s; }
      #splash .l4 { animation-delay: 0.76s; }
      #splash .l5 { animation-delay: 0.83s; }
      @keyframes splash-tile { to { opacity: 0; transform: scale(0.7); } }
      @keyframes splash-zc { from { fill: #fff; } }
      @keyframes splash-z { from { transform: translateX(-13px); } to { transform: none; } }
      @keyframes splash-l { from { opacity: 0; transform: translateX(2px); } to { opacity: 1; transform: none; } }
      @keyframes splash-away { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #splash .tile { display: none; } #splash .z, #splash .l { animation: none; } }
    </style>
</head>
<body>

l l2"><rect x="16" y="0" width="1" height="1"/><rect x="20" y="0" width="1" height="1"/><rect x="16" y="1" width="1" height="1"/><rect x="17" y="1" width="1" height="1"/><rect x="20" y="1" width="1" height="1"/><rect x="16" y="2" width="1" height="1"/><rect x="18" y="2" width="1" height="1"/><rect x="20" y="2" width="1" height="1"/><rect x="16" y="3" width="1" height="1"/><rect x="19" y="3" width="1" height="1"/><rect x="20" y="3" width="1" height="1"/><rect x="16" y="4" width="1" height="1"/><rect x="20" y="4" width="1" height="1"/><rect x="16" y="5" width="1" height="1"/><rect x="20" y="5" width="1" height="1"/><rect x="16" y="6" width="1" height="1"/><rect x="20" y="6" width="1" height="1"/></g><g class="l l1"><rect x="22" y="3" width="1" height="1"/><rect x="23" y="3" width="1" height="1"/><rect x="24" y="3" width="1" height="1"/></g><g class="z"><rect x="29" y="0" width="1" height="1"/><rect x="30" y="0" width="1" height="1"/><rect x="28" y="1" width="1" height="1"/><rect x="29" y="1" width="1" height="1"/><rect x="27" y="2" width="1" height="1"/><rect x="28" y="2" width="1" height="1"/><rect x="26" y="3" width="1" height="1"/><rect x="27" y="3" width="1" height="1"/><rect x="28" y="3" width="1" height="1"/><rect x="29" y="3" width="1" height="1"/><rect x="30" y="3" width="1" height="1"/><rect x="28" y="4" width="1" height="1"/><rect x="29" y="4" width="1" height="1"/><rect x="27" y="5" width="1" height="1"/><rect x="28" y="5" width="1" height="1"/><rect x="26" y="6" width="1" height="1"/><rect x="27" y="6" width="1" height="1"/></g></svg></div>
<div id="app"></div>

</body>
</html>
