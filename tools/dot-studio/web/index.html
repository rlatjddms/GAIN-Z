<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAIN-Z 도트 공방</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="dot"></span>도트 공방<small>GAIN-Z 캐릭터 스프라이트</small></div>
    <div class="layer-tabs" id="layerTabs"></div>
    <div class="top-right">
      <span class="status" id="status"></span>
      <button class="btn primary" id="btnSave" title="저장 (Ctrl+S)">저장</button>
    </div>
  </header>

  <aside class="side">
    <div class="side-head">스프라이트 <span id="layerLabel"></span></div>
    <ul class="sprites" id="sprites"></ul>
    <div class="new-row">
      <input id="newName" placeholder="새 이름 (예: PONYTAIL)" spellcheck="false">
      <button class="btn small" id="btnNew">추가</button>
    </div>
    <p class="side-note">파일명 = 백엔드 enum 값. <code>frontend/src/assets/sprites/</code>에 저장됩니다.</p>
  </aside>

  <main class="stage" id="stage">
    <div class="toolbar" id="toolbar">
      <button class="tool on" data-tool="pen" title="펜 (B) · Shift+클릭: 직선"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg><kbd>B</kbd></button>
      <button class="tool" data-tool="eraser" title="지우개 (E) · 오른쪽 클릭도 지우개"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M5 15l8-8 6 6-6 6H9z"/><path d="M9 11l6 6"/></svg><kbd>E</kbd></button>
      <button class="tool" data-tool="fill" title="채우기 (F)"><svg viewBox="0 0 24 24"><path d="M5 12l7-7 7 7-7 7z"/><path d="M5 12h14"/><path d="M20 16c0 1.5-1 3-2 3s-2-1.5-2-3 2-3 2-3 2 1.5 2 3z"/></svg><kbd>F</kbd></button>
      <button class="tool" data-tool="picker" title="색 뽑기 (I) · Alt+클릭"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-2 2-6-6z"/><path d="M13 9l-8 8v3h3l8-8"/></svg><kbd>I</kbd></button>
      <button class="tool" data-tool="select" title="선택 (R) · 드래그로 영역 선택, 안을 잡고 끌면 그 부분만 옮김 · Ctrl+C/X/V 복사·잘라내기·붙여넣기 · Del 지우기 · Esc 해제"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 3"/></svg><kbd>R</kbd></button>
      <button class="tool" data-tool="move" title="이동 (V) · 선택 영역이 있으면 그 부분만, 없으면 그림 전체를 칸 단위로 옮김 · 방향키: 한 칸씩"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><kbd>V</kbd></button>
      <span class="sep"></span>
      <button class="tool toggle" id="tMirror" title="좌우 대칭 (M)"><svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M9 7L4 12l5 5z"/><path d="M15 7l5 5-5 5z"/></svg><kbd>M</kbd></button>
      <button class="tool toggle on" id="tOthers" title="다른 레이어 겹쳐 보기 (Tab)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="12" height="12" rx="2"/><rect x="8" y="8" width="12" height="12" rx="2" opacity=".5"/></svg><kbd>Tab</kbd></button>
      <button class="tool toggle on" id="tGrid" title="격자 (G)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg><kbd>G</kbd></button>
      <span class="sep"></span>
      <button class="tool" id="tUndo" title="되돌리기 (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="tool" id="tRedo" title="다시 (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <span class="sep"></span>
      <button class="tool" id="tClear" title="이 레이어 비우기"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="paint" width="768" height="1024"></canvas>
        <div class="cursor" id="cursor"></div>
      </div>
      <div class="zoom">
        <button class="mini" id="zOut">−</button><span id="zLabel">100%</span><button class="mini" id="zIn">+</button><button class="mini" id="zFit" title="화면에 맞추기 (0)">맞춤</button>
      </div>
      <div class="hint" id="hint">Space+드래그 또는 휠 클릭: 이동 · 휠: 확대 · Shift+클릭: 직선 · R: 선택 · Ctrl+C/V: 복사·붙여넣기 · 방향키: 한 칸 이동</div>
    </div>
  </main>

  <aside class="palette">
    <div class="cur-row">
      <label class="current" title="색 직접 고르기"><span id="curSwatch"></span><input type="color" id="colorInput"></label>
      <div class="cur-side">
        <input id="hexInput" class="hex" spellcheck="false" maxlength="7" title="색 코드">
        <div class="shade-btns"><button class="mini-btn" id="btnLighter">밝게</button><button class="mini-btn" id="btnDarker">어둡게</button></div>
      </div>
    </div>
    <div class="pal-sec">
      <b>기준색 <small>사용자 색으로 바뀜</small></b>
      <div class="keys" id="keyColors"></div>
    </div>
    <div class="pal-sec"><b>고정색</b><div class="swatches grid" id="fixedColors"></div></div>
    <div class="pal-sec"><b>이 그림의 색</b><div class="swatches grid" id="usedColors"></div></div>
    <div class="pal-sec"><b>최근</b><div class="swatches grid" id="recentColors"></div></div>

    <div class="pv">
      <div class="side-head">미리보기 <span class="live"><i></i>실제 색</span></div>
      <canvas id="pvCanvas" width="192" height="264"></canvas>
      <div class="pv-controls">
        <!-- 레이어마다 고르는 칸은 app.js가 LAYER_ORDER대로 만든다 -->
        <div id="pvLayerSelects" class="pv-layers"></div>
        <label>피부색 <input type="color" id="pvSkinColor" value="#F8D7B5"></label>
        <label>머리색 <input type="color" id="pvHairColor" value="#EC4899"></label>
        <label>악기색 <input type="color" id="pvInstrumentColor" value="#B91C1C"></label>
        <label>의상색 <input type="color" id="pvOutfitColor" value="#FFFFFF"></label>
      </div>
    </div>
  </aside>
</div>
<div class="toasts" id="toasts"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
