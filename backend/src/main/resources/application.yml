spring:
  application:
    name: gainz-backend

  profiles:
    include: secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 악보 파일 올리기: 한 장 10MB (SheetFileStorage.MAX_FILE_BYTES와 같게), 한 번에 100MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# 올린 파일 저장 폴더 (기본: 사용자 홈/.gainz/uploads)
gainz:
  upload-dir: ${user.home}/.gainz/uploads

server:
  port: 8080
