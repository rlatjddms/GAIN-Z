spring:
  application:
    name: gainz-backend

  # 로컬: application-secret.yml (커밋 안 함)에 비밀값을 둔다. 운영: SPRING_PROFILES_ACTIVE=prod 로 application-prod.yml을 쓴다 (#174)
  profiles:
    include: secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # PostgreSQL 예약어(user 테이블 등)는 자동으로 따옴표를 붙인다. MariaDB에서도 그대로 동작한다 (#178)
        auto_quote_keyword: true

  # 악보 파일 올리기: 한 장 10MB (SheetFileStorage.MAX_FILE_BYTES와 같게), 한 번에 100MB
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB

  # 소셜 로그인에서 비밀이 아닌 설정. client-id·client-secret은 secret/prod 프로필에서 넣는다
  security:
    oauth2:
      client:
        registration:
          google:
            scope: profile, email
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, account_email
          naver:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

gainz:
  # 올린 파일 저장 폴더 (기본: 사용자 홈/.gainz/uploads)
  upload-dir: ${user.home}/.gainz/uploads
  # 올린 파일을 둘 곳: local(위 폴더) / supabase(Supabase Storage, 운영) (#178)
  storage:
    type: local
  # 프론트 주소. CORS 허용 출처이자 소셜 로그인이 끝나면 돌아갈 곳 (#174)
  frontend-url: http://localhost:5173
  # 여러 출처를 허용하려면 쉼표로 적는다. 비우면 frontend-url 하나만 허용
  # allowed-origins: http://localhost:5173,http://192.168.0.10:5173

server:
  port: 8080
