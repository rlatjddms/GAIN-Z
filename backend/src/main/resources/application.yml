spring:
  application:
    name: gainz-backend

  # 로컬: application-secret.yml (커밋 안 함)에 비밀값을 둔다. 운영: SPRING_PROFILES_ACTIVE=prod 로 application-prod.yml을 쓴다 (#174)
  profiles:
    include: secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # PostgreSQL 예약어(user 테이블 등)는 자동으로 따옴표를 붙인다. MariaDB에서도 그대로 동작한다 (#178)
        auto_quote_keyword: true
        # DB 연결은 트랜잭션이 끝나면 바로 돌려준다. 기본값(요청이 끝날 때까지 쥐고 있음)이면 실시간 알림(SSE)처럼
        # 30분씩 열려 있는 요청이 연결을 하나씩 붙잡아, 연결 수가 적은 운영 DB에서 다른 요청·헬스 체크가 멈춘다
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

  # 파일 올리기: 한 파일 30MB(잼 음원 BandAttachmentStorage.AUDIO_MAX_BYTES가 가장 큼), 한 번에 100MB.
  # 종류별 한도(악보 10MB·첨부 10MB 등)는 각 저장소 코드에서 따로 확인한다
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB

  # 소셜 로그인에서 비밀이 아닌 설정. client-id·client-secret은 secret/prod 프로필에서 넣는다
  # 이메일만 받는다 (#227: 이름·닉네임은 받지 않음). 네이버는 scope가 아니라 개발자 센터의 제공 정보 설정을 따른다
  security:
    oauth2:
      client:
        registration:
          google:
            scope: email
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: account_email
          naver:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope: email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

gainz:
  # 올린 파일 저장 폴더 (기본: 사용자 홈/.gainz/uploads)
  upload-dir: ${user.home}/.gainz/uploads
  # 올린 파일을 둘 곳: local(위 폴더) / supabase(Supabase Storage, 운영) (#178)
  storage:
    type: local
  # 메일 (#193): log(기본, 메일 대신 로그에 링크) / brevo(운영)
  mail:
    type: log
  # 프론트 주소. CORS 허용 출처이자 소셜 로그인이 끝나면 돌아갈 곳 (#174)
  frontend-url: http://localhost:5173
  # 여러 출처를 허용하려면 쉼표로 적는다. 비우면 frontend-url 하나만 허용
  # allowed-origins: http://localhost:5173,http://192.168.0.10:5173

server:
  port: 8080
