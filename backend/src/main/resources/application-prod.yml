# 운영 설정 (#174). 값은 전부 환경 변수로 받는다. 실행: SPRING_PROFILES_ACTIVE=prod
# 필수: DB_URL, DB_USERNAME, DB_PASSWORD, REDIS_HOST, JWT_SECRET, FRONTEND_URL,
#       GOOGLE_CLIENT_ID/SECRET, KAKAO_CLIENT_ID/SECRET, NAVER_CLIENT_ID/SECRET
spring:
  # 드라이버는 DB_URL로 정해진다. 예) jdbc:postgresql://호스트:5432/postgres?sslmode=require (#178)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      # 운영은 스키마를 검사만 한다. 첫 배포처럼 테이블을 만들어야 할 때만 DDL_AUTO=update 로 한 번 띄운다
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        auto_quote_keyword: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}

gainz:
  frontend-url: ${FRONTEND_URL}
  allowed-origins: ${ALLOWED_ORIGINS:${FRONTEND_URL}}
  upload-dir: ${UPLOAD_DIR:/data/uploads}

# API 문서는 운영에서 기본으로 끈다. 보려면 SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  # nginx 같은 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 읽어야 소셜 로그인 redirect-uri의 {baseUrl}이 바깥 주소(https://도메인)로 잡힌다
  forward-headers-strategy: framework
