# 운영 설정 (#174). 값은 전부 환경 변수로 받는다. 실행: SPRING_PROFILES_ACTIVE=prod
# 필수: DB_URL, DB_USERNAME, DB_PASSWORD, REDIS_HOST(또는 SPRING_DATA_REDIS_URL), JWT_SECRET, FRONTEND_URL,
#       GOOGLE_CLIENT_ID/SECRET, KAKAO_CLIENT_ID/SECRET, NAVER_CLIENT_ID/SECRET
# 파일을 Supabase에 둘 때: STORAGE_TYPE=supabase, SUPABASE_URL, SUPABASE_SERVICE_KEY (버킷 이름 SUPABASE_BUCKET, 기본 uploads)
spring:
  # 드라이버는 DB_URL로 정해진다. 예) jdbc:postgresql://호스트:5432/postgres?sslmode=require (#178)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 무료 DB(Supabase) 연결 수 제한에 맞춰 줄일 수 있다 (#180)
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  data:
    redis:
      # Render Key Value처럼 주소 한 줄(redis://…)로 받을 때는 SPRING_DATA_REDIS_URL 을 넣는다. 그러면 host·port보다 먼저 쓴다 (#180)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      # 운영은 스키마를 검사만 한다. 첫 배포처럼 테이블을 만들어야 할 때만 DDL_AUTO=update 로 한 번 띄운다
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        auto_quote_keyword: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}

gainz:
  frontend-url: ${FRONTEND_URL}
  allowed-origins: ${ALLOWED_ORIGINS:${FRONTEND_URL}}
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  # local: 위 폴더(docker compose 볼륨) / supabase: Supabase Storage 비공개 버킷 (#178)
  # 메일 (#193): brevo 로 두면 BREVO_API_KEY·MAIL_FROM 도 필요. 기본 log 는 보내지 않고 로그에만
  mail:
    type: ${MAIL_TYPE:log}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:GAIN-Z}
    brevo:
      api-key: ${BREVO_API_KEY:}
  storage:
    type: ${STORAGE_TYPE:local}
    supabase:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_BUCKET:uploads}
      service-key: ${SUPABASE_SERVICE_KEY:}

# API 문서는 운영에서 기본으로 끈다. 보려면 SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  # Render는 PORT 를 넣어 준다 (#180)
  port: ${SERVER_PORT:${PORT:8080}}
  # nginx 같은 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 읽어야 소셜 로그인 redirect-uri의 {baseUrl}이 바깥 주소(https://도메인)로 잡힌다
  forward-headers-strategy: framework
