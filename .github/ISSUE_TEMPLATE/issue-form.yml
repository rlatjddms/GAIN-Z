name: "🛠 이슈 생성"
description: "새로운 기능, 버그 수정, 리팩토링 등을 위한 이슈를 생성합니다."
title: '[Label] 이슈 제목'
body:
  - type: dropdown
    id: type
    attributes:
      label: 📌 작업 타입
      options:
        - 🚀 Epic (대단위 기능 묶음)
        - ✨ Feature (새로운 기능 추가)
        - 🐞 Bug (버그 수정)
        - ♻️ Refactor (코드 개선)
        - 📝 Docs (문서 작성)
        - 🎸 Chore (기타 작업)
    validations:
      required: true
      
  - type: input
    id: epic_no
    attributes:
      label: 🔗 관련 에픽 (Epic Number)
      description: 이 이슈가 속한 에픽 번호를 적어주세요. 에픽 생성 시에는 생략합니다.
      placeholder: "#번호"

  - type: textarea
    attributes:
      label: 📄 상세 내용 (Description)
      description: 이슈에 대한 구체적인 설명을 작성해주세요.
    validations:
      required: true
      
  - type: textarea
    attributes:
      label: ✅ 할 일 (Checklist)
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🙋🏻 참고 자료
      description: 참고 이미지, 링크, 관련 이슈 번호 등을 작성해 주세요.
