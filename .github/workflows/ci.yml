# PR마다 백엔드 테스트·프론트 빌드·프론트 브라우저 테스트를 자동으로 돌린다 (#248)
# 머지를 막는 필수 체크로 지정할지는 동작을 확인한 뒤 사람이 정한다 (Settings → Rules)
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 같은 PR(브랜치)에 새로 push하면 돌던 것은 취소한다 (비공개 레포는 월 무료 사용 시간이 정해져 있어서)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle 의존성·빌드 캐시
      - uses: gradle/actions/setup-gradle@v4
      # Mockito 단위 테스트와 H2 리포지토리 테스트라 DB·Redis·비밀값(application-secret.yml)이 없어도 된다
      - run: chmod +x gradlew && ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend-build:
    name: 프론트 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-test:
    name: 프론트 테스트
    runs-on: ubuntu-latest
    # 크롬과 필요한 라이브러리가 깔린 Playwright 공식 이미지에서 돌린다 (#316).
    # 매번 설치(npx playwright install --with-deps)하면 Ubuntu 패키지 받기에 따라 20초~13분으로 들쭉날쭉했다.
    # 태그는 package-lock.json의 playwright 버전과 같아야 한다. 버전을 올리면 여기도 같이 올린다 (다르면 "Executable doesn't exist"로 실패)
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # 크롬이 공유 메모리를 넉넉히 쓰게 (Playwright 권장)
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Playwright 브라우저 테스트 (가짜 API 응답, 실제 서버 없음). 브라우저는 이미지에 들어 있다
      - run: npm test
      - name: 실패한 테스트 화면 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results
          retention-days: 7
