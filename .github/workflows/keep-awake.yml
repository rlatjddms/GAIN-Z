# Render 무료 백엔드는 15분 동안 요청이 없으면 잠들고, 깨는 데 1분쯤 걸린다 (#180).
# 10분마다 헬스 체크를 불러 깨워 둔다. 헬스 체크가 DB도 한 번 물어서 Supabase가 쉬는 프로젝트로 멈추지 않는다.
# 레포 Settings → Secrets and variables → Actions → Variables 에 BACKEND_URL (예: https://gainz-backend.onrender.com)을 넣는다.
# 예약 실행은 기본 브랜치(main)에 있는 이 파일로만 돈다
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: 헬스 체크 호출
        # 잠들어 있었다면 깨는 동안 기다린다 (최대 약 3분)
        run: curl --silent --show-error --fail --retry 5 --retry-delay 30 --retry-all-errors --max-time 60 "${{ vars.BACKEND_URL }}/api/v1/health"
